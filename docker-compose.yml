services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-couple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-couple}
      POSTGRES_DB: ${POSTGRES_DB:-couple_simulator}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-couple} -d ${POSTGRES_DB:-couple_simulator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://couple:couple@db:5432/couple_simulator}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
