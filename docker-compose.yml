services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-couple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-couple}
      POSTGRES_DB: ${POSTGRES_DB:-couple_simulator}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-couple} -d ${POSTGRES_DB:-couple_simulator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Build from the repo root so the image can install couple_simulator_engine
    # and rules_evaluator. Mount the engine tree (not only backend/) so an
    # editable install still sees content/events JSON.
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /workspace/backend
    command: ["sh", "scripts/start.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://couple:couple@db:5432/couple_simulator}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./couple_simulator_engine:/workspace/couple_simulator_engine
      - ./rules_evaluator:/workspace/rules_evaluator

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # One-off Python 3.12 jobs (lint/test for packages that are not the FastAPI image).
  # Not started by `docker compose up` — only via `docker compose run`.
  python-tools:
    profiles: ["tools"]
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
      PYTHONDONTWRITEBYTECODE: "1"

volumes:
  postgres_data:
  frontend_node_modules:
