[project]
name = "couple-simulator-engine"
version = "0.1.0"
description = "Console game engine for Couple Life Simulator (V0)"
requires-python = ">=3.12"
dependencies = [
    "rules-evaluator @ {root:uri}/../rules_evaluator",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["couple_simulator_engine"]

[tool.hatch.build.targets.wheel.force-include]
"couple_simulator_engine/content/events" = "couple_simulator_engine/content/events"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
