name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rules_evaluator: ${{ steps.filter.outputs.rules_evaluator }}
      couple_simulator_engine: ${{ steps.filter.outputs.couple_simulator_engine }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            rules_evaluator:
              - 'rules_evaluator/**'
            couple_simulator_engine:
              - 'couple_simulator_engine/**'
              - 'rules_evaluator/**'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy app/services app/shared

      - name: pytest
        run: pytest

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

  rules_evaluator:
    name: Rules evaluator
    needs: changes
    if: ${{ needs.changes.outputs.rules_evaluator == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules_evaluator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rules_evaluator/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: pytest
        run: pytest

  couple_simulator_engine:
    name: Game engine
    needs: changes
    if: ${{ needs.changes.outputs.couple_simulator_engine == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: couple_simulator_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            couple_simulator_engine/pyproject.toml
            rules_evaluator/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: pytest
        run: pytest

  migrations:
    name: Migration consistency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: couple
          POSTGRES_PASSWORD: couple
          POSTGRES_DB: couple_simulator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U couple -d couple_simulator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://couple:couple@localhost:5432/couple_simulator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check models match migrations
        run: alembic check
